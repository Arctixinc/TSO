{% extends "base.html" %}

{% block title %}Login - Telegram Stremio{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="mx-auto h-16 w-16 bg-gradient-to-br from-primary to-accent rounded-2xl flex items-center justify-center shadow-lg shadow-primary/30 mb-6 transform rotate-3 hover:rotate-6 transition-transform duration-300">
                <i class="fas fa-play text-2xl text-white"></i>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                Welcome Back
            </h2>
            <p class="mt-2 text-sm theme-text-secondary">
                Access your media dashboard
            </p>
        </div>
        
        <!-- Card -->
        <div class="theme-card backdrop-blur-xl bg-opacity-90 p-8 rounded-2xl shadow-2xl border border-gray-200/50 relative overflow-hidden">
            <!-- Decorative blur blob -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
            
            {% if error %}
            <div class="mb-6 bg-red-50/50 dark:bg-red-900/10 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-300 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}
            
            <form method="post" class="space-y-6 relative z-10">
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider theme-text-secondary mb-2 ml-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none theme-text-secondary opacity-50">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="username" name="username" required
                               class="w-full pl-10 pr-4 py-3 rounded-xl border bg-background/50 focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm placeholder-gray-400"
                               placeholder="Enter your username">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider theme-text-secondary mb-2 ml-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none theme-text-secondary opacity-50">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" required
                               class="w-full pl-10 pr-4 py-3 rounded-xl border bg-background/50 focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm placeholder-gray-400"
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full bg-gradient-to-r from-primary to-secondary hover:to-primary text-white py-3 px-4 rounded-xl shadow-lg shadow-primary/30 hover:shadow-primary/50 transform hover:-translate-y-0.5 transition-all duration-300 font-bold text-sm">
                        Sign In <i class="fas fa-arrow-right ml-2 text-xs"></i>
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Footer Links -->
        <div class="text-center space-y-2">
            <p class="text-xs theme-text-secondary opacity-70">
                Protected area. Authorized personnel only.
            </p>
            <div class="flex justify-center gap-4 text-sm font-medium">
                <a href="/status" class="text-primary hover:text-secondary transition-colors">System Status</a>
                <span class="text-gray-300">•</span>
                <a href="/stremio" class="text-primary hover:text-secondary transition-colors">Stremio Guide</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
