{% extends "base.html" %}

{% block title %}Admin Dashboard - Media Manager{% endblock %}

{% block content %}
<div class="max-w-[1920px] mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-8 pb-6 border-b border-gray-200/10">
        <div>
            <div class="flex items-center gap-3 mb-2">
                <span class="px-2 py-1 rounded bg-red-100 text-red-600 text-xs font-bold uppercase tracking-wide">Admin Area</span>
            </div>
            <h1 class="text-3xl font-bold">Media Manager</h1>
            <p class="theme-text-secondary mt-1 text-sm">Review, edit, and clean up database entries.</p>
        </div>

        <div class="flex gap-2">
            <a href="?media_type=movie"
               class="px-4 py-2 rounded-lg text-sm font-medium transition-all border border-gray-200/20 {% if media_type == 'movie' %}bg-primary text-white shadow-md{% else %}bg-card hover:bg-gray-50/10{% endif %}">
                <i class="fas fa-film mr-2"></i>Movies
            </a>
            <a href="?media_type=tv"
               class="px-4 py-2 rounded-lg text-sm font-medium transition-all border border-gray-200/20 {% if media_type == 'tv' %}bg-primary text-white shadow-md{% else %}bg-card hover:bg-gray-50/10{% endif %}">
                <i class="fas fa-tv mr-2"></i>TV Shows
            </a>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="mb-6 flex flex-col xl:flex-row gap-4">
        <!-- Search -->
        <div class="flex-1 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <i class="fas fa-search"></i>
            </div>
            <input type="text" id="search-input"
                   class="w-full pl-10 pr-4 py-2 rounded-lg border bg-card focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-sm"
                   placeholder="Search ID, Title, or Filename...">
        </div>

        <!-- Filters -->
        <div class="flex gap-2 overflow-x-auto pb-2 xl:pb-0">
            <select id="sort-by" class="px-3 py-2 rounded-lg border bg-card text-sm focus:ring-2 focus:ring-primary/50">
                <option value="updated_on">Last Updated</option>
                <option value="created_at">Date Added</option>
                <option value="title">Title</option>
                <option value="rating">Rating</option>
            </select>

            <select id="sort-order" class="px-3 py-2 rounded-lg border bg-card text-sm focus:ring-2 focus:ring-primary/50">
                <option value="desc">Desc</option>
                <option value="asc">Asc</option>
            </select>

            <button onclick="loadMedia(1)" class="px-4 py-2 bg-secondary text-white rounded-lg text-sm font-medium hover:opacity-90 whitespace-nowrap">
                Refresh
            </button>
        </div>
    </div>

    <!-- Data Table Container -->
    <div class="theme-card rounded-lg border shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="border-b bg-gray-50/5 text-xs uppercase tracking-wider theme-text-secondary">
                        <th class="px-6 py-4 font-semibold">Poster</th>
                        <th class="px-6 py-4 font-semibold w-1/3">Title / Metadata</th>
                        <th class="px-6 py-4 font-semibold">IDs</th>
                        <th class="px-6 py-4 font-semibold text-center">Files</th>
                        <th class="px-6 py-4 font-semibold text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="media-table-body" class="divide-y divide-gray-200/10">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </div>

        <!-- Pagination Footer -->
        <div class="px-6 py-4 border-t border-gray-200/10 flex items-center justify-between bg-gray-50/5">
            <div class="text-xs theme-text-secondary" id="table-info">Showing 0 results</div>
            <div class="flex gap-1" id="pagination"></div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
const mediaType = '{{ media_type }}';

async function loadMedia(page = 1) {
    const search = document.getElementById('search-input').value.trim();
    const sortBy = document.getElementById('sort-by').value;
    const sortOrder = document.getElementById('sort-order').value;

    document.getElementById('media-table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>Loading data...</td></tr>`;

    try {
        const res = await fetch(`/api/media/list?media_type=${mediaType}&page=${page}&page_size=20&search=${encodeURIComponent(search)}&sort_by=${sortBy}&sort_order=${sortOrder}`);
        const data = await res.json();
        renderTable(data);
    } catch(e) {
        console.error(e);
        document.getElementById('media-table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error loading data</td></tr>`;
    }
}

function renderTable(data) {
    const items = data[mediaType === 'movie' ? 'movies' : 'tv_shows'] || [];
    const tbody = document.getElementById('media-table-body');

    if(!items.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center theme-text-secondary">No records found.</td></tr>`;
        return;
    }

    tbody.innerHTML = items.map(item => {
        const title = item.title || 'Untitled';
        const poster = item.poster || 'https://via.placeholder.com/40';
        const filesCount = mediaType === 'movie' ? (item.telegram?.length || 0) : (item.seasons?.reduce((acc, s) => acc + s.episodes.length, 0) || 0);

        return `
        <tr class="hover:bg-gray-50/5 transition-colors group">
            <td class="px-6 py-3">
                <div class="w-12 h-16 bg-gray-200 rounded overflow-hidden shadow-sm border">
                    <img src="${poster}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/40'">
                </div>
            </td>
            <td class="px-6 py-3">
                <div class="font-bold text-base text-primary mb-1">${title}</div>
                <div class="flex flex-wrap gap-2 text-xs theme-text-secondary">
                    <span class="bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded">${item.release_year || 'N/A'}</span>
                    <span>${item.rating ? '⭐ ' + item.rating : ''}</span>
                    <span>${item.genres?.slice(0,2).join(', ') || ''}</span>
                </div>
            </td>
            <td class="px-6 py-3 text-xs font-mono theme-text-secondary">
                <div title="TMDB ID">T: ${item.tmdb_id}</div>
                <div title="DB Index">D: ${item.db_index}</div>
                ${item.imdb_id ? `<div title="IMDB ID" class="text-blue-500">I: ${item.imdb_id}</div>` : ''}
            </td>
            <td class="px-6 py-3 text-center">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${filesCount > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                    ${filesCount} ${mediaType === 'movie' ? 'Files' : 'Eps'}
                </span>
            </td>
            <td class="px-6 py-3 text-right">
                <div class="flex justify-end gap-2 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                    <a href="/media/edit?tmdb_id=${item.tmdb_id}&db_index=${item.db_index}&media_type=${mediaType}"
                       class="p-2 text-blue-600 hover:bg-blue-50 rounded transition-colors" title="Edit">
                        <i class="fas fa-pen"></i>
                    </a>
                    <button onclick="deleteItem(${item.tmdb_id}, ${item.db_index}, '${title.replace(/'/g, "\\'")}')"
                            class="p-2 text-red-600 hover:bg-red-50 rounded transition-colors" title="Delete">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </td>
        </tr>
        `;
    }).join('');

    updatePagination(data.current_page, data.total_pages);

    const start = ((data.current_page - 1) * 20) + 1;
    const end = Math.min(data.current_page * 20, data.total_count);
    document.getElementById('table-info').textContent = `Displaying ${start}-${end} of ${data.total_count}`;
}

function updatePagination(curr, total) {
    const div = document.getElementById('pagination');
    let html = '';

    if (curr > 1) html += `<button onclick="loadMedia(${curr-1})" class="px-2 py-1 border rounded hover:bg-gray-100"><</button>`;
    html += `<span class="px-2 py-1 text-xs font-medium">Page ${curr} of ${total}</span>`;
    if (curr < total) html += `<button onclick="loadMedia(${curr+1})" class="px-2 py-1 border rounded hover:bg-gray-100">></button>`;

    div.innerHTML = html;
}

async function deleteItem(tmdbId, dbIndex, title) {
    if(!confirm(`Delete "${title}"?`)) return;
    try {
        await fetch(`/api/media/delete?tmdb_id=${tmdbId}&db_index=${dbIndex}&media_type=${mediaType}`, { method: 'DELETE' });
        loadMedia(currentPage);
    } catch(e) { alert(e.message); }
}

// Debounce search
let timeout;
document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(() => loadMedia(1), 300);
});

// Init
document.addEventListener('DOMContentLoaded', () => loadMedia());
</script>
{% endblock %}
